# Long training job (runs on GitHub-hosted runners).
# Public repo => unlimited Actions minutes, so training can be chained across
# runs: pass `resume_run=<previous run id>` to continue from its checkpoint.
name: train

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "max training steps"
        default: "100000"
      max_minutes:
        description: "wall-clock budget (minutes)"
        default: "300"
      examples:
        description: "corpus size limit (0 = all)"
        default: "12000"
      embd:
        description: "embedding dim"
        default: "128"
      layer:
        description: "number of layers"
        default: "4"
      head:
        description: "attention heads"
        default: "4"
      block:
        description: "context length"
        default: "128"
      batch:
        description: "batch size"
        default: "32"
      lr:
        description: "learning rate"
        default: "3e-4"
      resume_run:
        description: "run id to resume from (empty = fresh)"
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ >/dev/null

      - name: Install python deps
        run: python3 -m pip install --quiet --disable-pip-version-check pyarrow

      - name: Fetch Portuguese corpus
        run: python3 scripts/fetch_corpus.py --out data/corpus.txt \
          --limit ${{ github.event.inputs.examples || '0' }}

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Gradient check
        run: ./build/slmpt_gradcheck

      - name: Smoke test (fast)
        run: |
          mkdir -p runs/smoke
          ./build/slmpt_train --data data/corpus.txt --out runs/smoke \
            --embd 64 --layer 2 --head 4 --block 64 --batch 8 \
            --steps 30 --save-every 30 --sample-every 30 --threads 4

      - name: Resume previous checkpoint (optional)
        if: ${{ github.event.inputs.resume_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs
          gh run download "${{ github.event.inputs.resume_run }}" \
            --name slm-pt-run -D runs || \
            gh run download "${{ github.event.inputs.resume_run }}" -D runs
          find runs -name model.bin

      - name: Train
        run: |
          mkdir -p runs
          RESUME=""
          if [ -f runs/model.bin ]; then RESUME="--resume runs/model.bin"; fi
          ./build/slmpt_train --data data/corpus.txt --out runs \
            --embd ${{ github.event.inputs.embd || '128' }} \
            --layer ${{ github.event.inputs.layer || '4' }} \
            --head ${{ github.event.inputs.head || '4' }} \
            --block ${{ github.event.inputs.block || '128' }} \
            --batch ${{ github.event.inputs.batch || '32' }} \
            --lr ${{ github.event.inputs.lr || '3e-4' }} \
            --steps ${{ github.event.inputs.steps || '100000' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '300' }} \
            --save-every 500 --sample-every 250 --threads "$(nproc)" $RESUME

      - name: Upload checkpoint + samples
        uses: actions/upload-artifact@v4
        with:
          name: slm-pt-run
          path: |
            runs/model.bin
            runs/samples.txt
          if-no-files-found: warn
