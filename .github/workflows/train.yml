# Long training job (runs on GitHub-hosted runners).
# One single model, trained forever: every run resumes the latest successful
# checkpoint (never from scratch), so the weights keep improving over time.
# A run can also resume a specific run with `resume_run=<id>`.
name: train

on:
  schedule:
    # continuous training of the single KizuSmall model: every 6h a new run
    # resumes the latest successful checkpoint (never from scratch).
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      steps:
        description: "max training steps per run (loop also stops on time)"
        default: "100000"
      max_minutes:
        description: "wall-clock budget (minutes)"
        default: "300"
      examples:
        description: "alpaca pairs limit (0 = all)"
        default: "20000"
      alpaca_max_chars:
        description: "skip alpaca answers longer than this (0 = keep all)"
        default: "600"
      canarim_limit:
        description: "Canarim instruction pairs limit (0 = all)"
        default: "100000"
      canarim_max_chars:
        description: "skip Canarim answers longer than this (0 = keep all)"
        default: "800"
      chat_weight:
        description: "repeat factor for generated chat"
        default: "4"
      oasst_weight:
        description: "repeat factor for oasst pairs"
        default: "2"
      wiki:
        description: "include Wikipedia raw prose (0/1)"
        default: "1"
      wiki_chars:
        description: "max raw-text characters (0 = whole dump)"
        default: "1500000000"
      bpe_vocab:
        description: "BPE vocabulary size"
        default: "8192"
      embd:
        description: "embedding dim"
        default: "384"
      layer:
        description: "number of layers"
        default: "7"
      head:
        description: "attention heads"
        default: "6"
      block:
        description: "context length"
        default: "512"
      batch:
        description: "batch size"
        default: "32"
      lr:
        description: "learning rate"
        default: "6e-4"
      resume_run:
        description: "run id to resume from (empty = fresh)"
        default: ""
      chain:
        description: "auto-resume from latest successful run (1 = yes)"
        default: "0"
      quant_bits:
        description: "quantization bits for the report (8/4/2)"
        default: "4"
      quantize:
        description: "run the int4 compression report (1 = yes; 0 = skip on train runs)"
        default: "0"
      profile:
        description: "print per-phase step timing (1 = on)"
        default: "0"
      require_avx512:
        description: "fail fast unless the runner has AVX-512 (1 = yes)"
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Detect SIMD
        run: |
          FLAGS="$(grep -m1 '^flags' /proc/cpuinfo || true)"
          if echo "$FLAGS" | grep -q avx512f; then
            echo "SIMD: AVX-512"
          elif echo "$FLAGS" | grep -q avx2; then
            echo "SIMD: AVX2"
            if [ "${{ github.event.inputs.require_avx512 }}" = "1" ]; then
              echo "::error::runner has AVX2, not AVX-512; failing fast so the job can be re-scheduled"
              exit 1
            fi
          else
            echo "SIMD: scalar/other"
          fi

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ >/dev/null

      - name: Install python deps
        run: python3 -m pip install --quiet --disable-pip-version-check pyarrow

      - name: Cache corpus text
        id: corpus_cache
        uses: actions/cache@v4
        with:
          path: data/corpus.txt
          # Deterministic corpus: same script + same knobs -> same text, so it is
          # safe to reuse across runs (the token ids are still re-encoded below).
          key: slmpt-corpus-${{ hashFiles('scripts/fetch_corpus.py') }}-${{ github.event.inputs.wiki || '1' }}-${{ github.event.inputs.wiki_chars || '1500000000' }}-${{ github.event.inputs.examples || '20000' }}-${{ github.event.inputs.alpaca_max_chars || '600' }}-${{ github.event.inputs.canarim_limit || '100000' }}-${{ github.event.inputs.canarim_max_chars || '800' }}-${{ github.event.inputs.chat_weight || '4' }}-${{ github.event.inputs.oasst_weight || '2' }}

      - name: Fetch Portuguese corpus
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch_corpus.py --out data/corpus.txt \
            --limit "${{ github.event.inputs.examples || '20000' }}" \
            --alpaca-max-chars "${{ github.event.inputs.alpaca_max_chars || '600' }}" \
            --canarim-limit "${{ github.event.inputs.canarim_limit || '100000' }}" \
            --canarim-max-chars "${{ github.event.inputs.canarim_max_chars || '800' }}" \
            --chat-weight "${{ github.event.inputs.chat_weight || '4' }}" \
            --oasst-weight "${{ github.event.inputs.oasst_weight || '2' }}" \
            --wiki "${{ github.event.inputs.wiki || '1' }}" \
            --wiki-chars "${{ github.event.inputs.wiki_chars || '1500000000' }}" \
            --prose-ratio 3.0

      - name: Note corpus reuse
        if: steps.corpus_cache.outputs.cache-hit == 'true'
        run: echo "corpus.txt restored from cache ($(du -h data/corpus.txt | cut -f1))"

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Resume previous checkpoint (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESUME_RUN="${{ github.event.inputs.resume_run }}"
          if [ -z "$RESUME_RUN" ] && { [ "${{ github.event.inputs.chain }}" = "1" ] || [ "${{ github.event_name }}" = "schedule" ]; }; then
            RESUME_RUN="$(gh run list --workflow=train.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
          fi
          mkdir -p runs
          if [ -n "$RESUME_RUN" ]; then
            echo "candidate resume run: $RESUME_RUN"
            rm -rf /tmp/prev && mkdir -p /tmp/prev
            gh run download "$RESUME_RUN" --name kizu-small-run -D /tmp/prev || \
              gh run download "$RESUME_RUN" --name slm-pt-run -D /tmp/prev || \
              gh run download "$RESUME_RUN" -D /tmp/prev || true
            # Only resume a checkpoint whose architecture matches the configured
            # one. A different n_embd/vocab would silently fail to load, and worse,
            # its frozen tokenizer would be copied and used to train the new model.
            WANT="embd=${{ github.event.inputs.embd || '384' }} layer=${{ github.event.inputs.layer || '7' }} head=${{ github.event.inputs.head || '6' }} block=${{ github.event.inputs.block || '512' }} vocab=${{ github.event.inputs.bpe_vocab || '8192' }}"
            PREV_ARCH="$(find /tmp/prev -name arch.txt -print -quit | xargs -r cat 2>/dev/null | tr -d '\n' || true)"
            if [ "$PREV_ARCH" = "$WANT" ]; then
              PREV="$(find /tmp/prev -name model.bin -print -quit)"
              if [ -n "$PREV" ]; then cp "$PREV" runs/model.bin; echo "resumed model -> runs/model.bin"; fi
              PREVTOK="$(find /tmp/prev -name tokenizer.txt -print -quit)"
              if [ -n "$PREVTOK" ]; then cp "$PREVTOK" data/tokenizer.base.txt; echo "frozen tokenizer -> data/tokenizer.base.txt"; fi
            else
              echo "arch mismatch (prev='$PREV_ARCH' want='$WANT') -> fresh start, not resuming"
            fi
          fi

      - name: Restore tokenizer cache
        id: tok_cache
        uses: actions/cache@v4
        with:
          path: data/tokenizer.cache.txt
          # Training BPE is the single most expensive setup step (minutes of CPU
          # on a large corpus).  It only depends on the BPE code and the target
          # vocab, so cache it and never retrain the same vocabulary again.
          key: slmpt-tokenizer-${{ hashFiles('apps/bpe.cpp') }}-v${{ github.event.inputs.bpe_vocab || '8192' }}

      - name: Build tokenizer + corpus ids
        run: |
          BASE=""
          if [ -f data/tokenizer.base.txt ]; then
            BASE="data/tokenizer.base.txt"        # resume: freeze the checkpoint's vocab
          elif [ -f data/tokenizer.cache.txt ]; then
            BASE="data/tokenizer.cache.txt"       # cache: skip the expensive BPE training
            echo "reusing cached tokenizer (skipping BPE training)"
          fi
          if [ -n "$BASE" ]; then
            # Reuse an existing vocabulary so a growing corpus can never change
            # the token ids (the checkpoint embeds this exact tokenizer).
            ./build/slmpt_bpe --load "$BASE" \
              --in data/corpus.txt --out data/tokenizer.txt --ids data/corpus.ids
          else
            ./build/slmpt_bpe --in data/corpus.txt --out data/tokenizer.txt \
              --ids data/corpus.ids --vocab "${{ github.event.inputs.bpe_vocab || '8192' }}"
          fi
          cp data/tokenizer.txt data/tokenizer.cache.txt

      - name: Gradient check
        run: ./build/slmpt_gradcheck

      - name: Smoke test (fast)
        run: |
          mkdir -p runs/smoke
          ./build/slmpt_train --data data/corpus.txt --ids data/corpus.ids \
            --tokenizer data/tokenizer.txt --out runs/smoke \
            --embd 64 --layer 2 --head 4 --block 64 --batch 8 \
            --steps 20 --save-every 20 --sample-every 20 --threads 4

      - name: Train
        env:
          SLMPT_PROFILE: ${{ github.event.inputs.profile || '0' }}
        run: |
          mkdir -p runs
          RESUME=""
          if [ -f runs/model.bin ]; then RESUME="--resume runs/model.bin"; fi
          ./build/slmpt_train --data data/corpus.txt --ids data/corpus.ids \
            --tokenizer data/tokenizer.txt --out runs \
            --embd ${{ github.event.inputs.embd || '384' }} \
            --layer ${{ github.event.inputs.layer || '7' }} \
            --head ${{ github.event.inputs.head || '6' }} \
            --block ${{ github.event.inputs.block || '512' }} \
            --batch ${{ github.event.inputs.batch || '32' }} \
            --lr ${{ github.event.inputs.lr || '6e-4' }} \
            --steps ${{ github.event.inputs.steps || '100000' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '300' }} \
            --save-every 500 --sample-every 500 --threads "$(nproc)" $RESUME

      - name: Evaluate (held-out perplexity)
        run: |
          ./build/slmpt_eval --model runs/model.bin --ids data/corpus.ids \
            --data data/corpus.txt --val 0.01 --max-tokens 200000 \
            --threads "$(nproc)" | tee runs/eval.txt

      - name: Compression report
        if: ${{ github.event.inputs.quantize == '1' }}
        run: |
          ./build/slmpt_quantize --model runs/model.bin --ids data/corpus.ids \
            --data data/corpus.txt --bits ${{ github.event.inputs.quant_bits || '4' }} \
            --group 64 --out runs/model_q.bin --val 0.01 --max-tokens 200000 \
            --threads "$(nproc)"

      - name: Upload checkpoint + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kizu-small-run
          path: |
            runs/model.bin
            runs/model_q.bin
            runs/samples.txt
            runs/eval.txt
            runs/arch.txt
            data/tokenizer.txt
          if-no-files-found: warn
