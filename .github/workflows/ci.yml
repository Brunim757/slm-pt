name: ci

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ >/dev/null
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Gradient check (analytic vs finite differences + KV cache)
        run: ./build/slmpt_gradcheck
      - name: BPE round-trip + end-to-end smoke
        run: |
          printf '<|system|>\nVocê é o KizuSmall, uma IA pequena.\n<|user|>\nOlá, tudo bem?\n<|assistant|>\nTudo ótimo! E você?\n<|end|>\n' > /tmp/s.txt
          printf '<|system|>\nVocê é o KizuSmall, uma IA pequena.\n<|user|>\nQuem é você?\n<|assistant|>\nSou uma IA pequena.\n<|end|>\n' >> /tmp/s.txt
          printf '<|text|>\nO Brasil é um país da América do Sul. Sua capital é Brasília.\n<|end|>\n' >> /tmp/s.txt
          for i in $(seq 1 200); do cat /tmp/s.txt; done > /tmp/corpus.txt
          ./build/slmpt_bpe --in /tmp/corpus.txt --out /tmp/tok.txt --ids /tmp/corpus.ids --vocab 512
          mkdir -p /tmp/runs
          ./build/slmpt_train --data /tmp/corpus.txt --ids /tmp/corpus.ids --tokenizer /tmp/tok.txt \
            --out /tmp/runs --embd 32 --layer 2 --head 2 --block 32 --batch 4 \
            --steps 10 --save-every 10 --sample-every 10 --threads 2
          ./build/slmpt_eval --model /tmp/runs/model.bin --ids /tmp/corpus.ids --val 0.1 --threads 2
          ./build/slmpt_quantize --model /tmp/runs/model.bin --ids /tmp/corpus.ids \
            --bits 4 --group 32 --out /tmp/runs/model_q.bin --val 0.1 --threads 2
